<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="./js/app.js" defer></script>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <span class="logo">
          <ion-icon name="reader-outline"></ion-icon>
        </span>
        <h1>WorkNest</h1>
        <p>Build productivity, one task at a time.</p>
      </header>

      <main>
        <form class="task--input">
          <input
            type="text"
            class="input"
            autofocus
            placeholder="What needs to be done?"
            required
          />
          <button type="submit" class="btn btn--add">
            <ion-icon name="add-outline"></ion-icon>
            <span>Add</span>
          </button>
        </form>

        <nav class="mini--nav">
          <a href="all" class="nav--active">All</a>
          <a href="active">Active</a>
          <a href="completed">Completed</a>
        </nav>
      </main>
      <section class="tasks">
        <div class="message">
          <ion-icon name="warning-outline"></ion-icon>

          <p class="no-item">There is no Task to show!!</p>
        </div>
        <ul class="task-list"></ul>
      </section>

      <script
        type="module"
        src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
      ></script>
    </div>
  </body>
</html>
