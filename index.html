<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Focus Flow - Task Manager</title>
  </head>
  <body>
    <header class="header">
      <h1 class="logo">Focus Flow</h1>
      <button type="button" id="addTaskBtn">Add Task</button>
    </header>

    <main>
      <section class="hero">
        <p>Today's Focus</p>
        <h2>
          Keep your flow
          <span>effortless.</span>
        </h2>
      </section>

      <section class="filters">
        <div>
          <button class="selected_filter" type="button">All</button>
          <button type="button">Active</button>
          <button type="button">Completed</button>
        </div>
      </section>

      <section class="list">
        <article>
          <div class="article_btn mark_complete marked">
            <svg
              class="mark_sign"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m4.5 12.75 6 6 9-13.5"
              />
            </svg>
          </div>
          <div>
            <h3 class="task_title">Review design system architecture</h3>
            <p class="task_detail">Created: 2h ago</p>
            <p class="task_detail">Due: Today, 6:00 PM</p>
          </div>
          <div class="article_btn delete">
            <svg
              class="delete_btn"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
              />
            </svg>
          </div>
        </article>
      </section>

      <section hidden class="empty_state">
        <h3>No tasks for today!</h3>
        <p>
          Take a moment for yourself or start planning your next big project.
        </p>
      </section>
    </main>

    <div id="addTaskModalOverlay"></div>
    <section id="addTaskModal" aria-label="Add task">
      <header class="modalHeader">
        <h3 class="modalHeader">New Task</h3>
        <p class="modalDetail">Organize your thoughts into flow.</p>
      </header>

      <form>
        <div>
          <label for="taskTitle">What needs to be done?</label>
          <input
            id="taskTitle"
            name="taskTitle"
            type="text"
            placeholder="e.g. Design user interview script"
          />
        </div>

        <div>
          <label for="taskDeadline">Deadline</label>
          <input id="taskDeadline" name="taskDeadline" type="datetime-local" />
        </div>

        <div class="form_actions">
          <button class="cancel" type="button">Cancel</button>
          <button class="add_task" type="submit">Add Task</button>
        </div>
      </form>
    </section>

    <script src="js/app.js"></script>
  </body>
</html>
